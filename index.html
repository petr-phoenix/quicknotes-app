<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Note App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Quick Note App</h1>
    <p>Organize your daily To Do list, work tasks, and study topics Easily.</p>
  </header>

  <main>
    <!-- Section 1: Add a note -->
    <section class="card">
      <h2>Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note Content</label>
          <input type="text" id="note-input" placeholder="Type your note here (max 200 characters)...">
        </div>
        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <!-- Section 2: Your notes -->
    <section class="card">
      <h2>Your notes</h2>
      <div class="search-box">
        <label for="search-input" class="sr-only">Search notes</label>
        <input type="text" id="search-input" placeholder="Search notes...">
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Quick Note App. Everything you Need To stay Organized.</p>
  </footer>
</body>
</html>
